name: Build Anos x7 APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses
      run: yes | sdkmanager --licenses || true

    - name: Setup Keystore & Environment
      run: |
        touch .env
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        else
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

    - name: Rename APK for Easy Identification
      run: |
        mkdir -p build-apks
        cp app/build/outputs/apk/debug/*.apk build-apks/Anos-x7.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Anos-x7-APK
        path: build-apks/Anos-x7.apk

    - name: Publish GitHub Release with APK
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      continue-on-error: true
      with:
        tag_name: v1.0-build${{ github.run_number }}
        name: Anos x7 - Version 1.0 (Build ${{ github.run_number }})
        body: |
          ### 🚀 Anos x7 - Game Booster Android
          Cliquez ci-dessous sur **Anos-x7.apk** pour télécharger et installer l'application sur votre smartphone Android.
        draft: false
        prerelease: false
        files: build-apks/Anos-x7.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
