name: Build Anos Store APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK Environment & Accept Licenses
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        
        # Accept all Android licenses automatically
        mkdir -p "$ANDROID_HOME/licenses" || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Install required platform & build-tools
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" || true

    - name: Setup Keystore and Environment Files
      run: |
        touch .env
        touch .env.example
        echo "APP_BUILD_TYPE=debug" > .env
        echo "APP_BUILD_TYPE=debug" > .env.example
        
        # Restore debug keystore
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        if [ ! -f "debug.keystore" ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        
        chmod +x ./gradlew

    - name: Build Debug APK with Gradle
      run: |
        ./gradlew :app:assembleDebug --stacktrace --no-daemon -Dorg.gradle.configuration-cache=false

    - name: Locate and Package APK
      run: |
        mkdir -p build-apks
        APK_PATH=$(find app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
        if [ -n "$APK_PATH" ]; then
          cp "$APK_PATH" build-apks/Anos-Store.apk
          echo "APK successfully found and prepared at build-apks/Anos-Store.apk"
        else
          echo "Error: APK not found in app/build/outputs/apk/debug/"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Anos-Store-APK
        path: build-apks/Anos-Store.apk
        retention-days: 14

    - name: Publish GitHub Release with APK
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      continue-on-error: true
      with:
        tag_name: v4.0-build${{ github.run_number }}
        name: Anos Store - Version v4.0 (Build ${{ github.run_number }})
        body: |
          ### 🔥 Anos Store - Version Officielle
          Téléchargez et installez le fichier **Anos-Store.apk** ci-dessous sur votre smartphone Android.
        draft: false
        prerelease: false
        files: build-apks/Anos-Store.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
