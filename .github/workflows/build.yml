name: Build Anos v4 APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Setup Keystore & Environment
      run: |
        touch .env
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        else
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

    - name: Prepare APK Package
      run: |
        mkdir -p build-apks
        cp app/build/outputs/apk/debug/*.apk build-apks/Anos-v4.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Anos-v4-APK
        path: build-apks/Anos-v4.apk

    - name: Publish GitHub Release with APK
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      continue-on-error: true
      with:
        tag_name: v4.0-build${{ github.run_number }}
        name: Anos v4 - Release (Build ${{ github.run_number }})
        body: |
          ### 🔥 Anos v4 - VIP Game Booster Android
          Téléchargez et installez le fichier **Anos-v4.apk** ci-dessous sur votre smartphone Android.
        draft: false
        prerelease: false
        files: build-apks/Anos-v4.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
