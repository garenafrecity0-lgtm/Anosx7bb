name: Build Anos Store APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses & Install Components
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

    - name: Setup Keystore & Environment
      run: |
        touch .env
        touch .env.example
        echo "APP_BUILD_TYPE=debug" >> .env
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        else
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

    - name: Prepare APK Package
      run: |
        mkdir -p build-apks
        find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} build-apks/Anos-Store.apk \;

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Anos-Store-APK
        path: build-apks/Anos-Store.apk

    - name: Publish GitHub Release with APK
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      continue-on-error: true
      with:
        tag_name: v4.0-build${{ github.run_number }}
        name: Anos Store - Release (Build ${{ github.run_number }})
        body: |
          ### 🔥 Anos Store - Espace Sécurisé & VIP Game Launcher Android
          Téléchargez et installez le fichier **Anos-Store.apk** ci-dessous sur votre smartphone Android.
        draft: false
        prerelease: false
        files: build-apks/Anos-Store.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
